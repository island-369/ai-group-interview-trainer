# 评估量表：8 维度 BARS 锚定（docs/01§6.2、04§6.1）
# score: 1-5 分，0.5 步进；action_if_low 用于报告的改进建议
dimensions:
  - key: content
    label: 内容贡献
    definition: 观点的质量、信息增量与对任务达成的推进作用
    anchors:
      "1": 全程无有效观点或只复读他人
      "2": 有观点但浅表，对结论几乎无影响
      "3": 有可用的观点或信息，贡献一般
      "4": 提出被小组采用的论据或标准，贡献明确
      "5": 提出被全组采纳的框架/标准/关键论据，主导了结论质量
    action_if_low: 下一次在讨论前半段主动提出一条评估标准或关键论据，而不是等待他人定调
  - key: logic
    label: 逻辑结构
    definition: 论证的结构性与说服力
    anchors:
      "1": 观点散乱，论据与结论脱节
      "2": 有结论无论证，或论证跳跃
      "3": 基本能自圆其说，结构一般
      "4": 结论先行、分点清晰、论据支撑
      "5": 结构严密，能识别他人论证漏洞并精准反驳
    action_if_low: 发言时先用一句话给结论，再讲"第一/第二"两条理由，控制每次只论证一个主张
  - key: communication
    label: 沟通表达
    definition: 语言流畅度、简洁度与感染力
    anchors:
      "1": 表达混乱无法理解，或长期沉默
      "2": 冗长重复、口头语多，重点模糊
      "3": 能说清观点，平淡或偶有啰嗦
      "4": 清晰流畅，重点突出，能自我收敛
      "5": 精炼有感染力，善用数字与类比
    action_if_low: 把单次发言压到三句话以内，先说结论再说理由，删掉口头语
  - key: listening
    label: 倾听回应
    definition: 对他人观点的注意与有效回应
    anchors:
      "1": 自说自话，无视讨论进程
      "2": 很少回应他人，只顾输出自己观点
      "3": 能接住部分讨论，回应较浅
      "4": 主动引用/整合他人观点，回应切题
      "5": 精准概括分歧点，回应推动共识形成
    action_if_low: 每次发言第一句先概括上一位发言者的要点（"刚才XX的意思是…"），再给回应
  - key: collaboration
    label: 团队协作
    definition: 促成共识、照顾他人、维护讨论质量
    anchors:
      "1": 打压他人、跑题或破坏讨论
      "2": 只顾自我表达，对团队目标无贡献
      "3": 配合讨论，协作意识一般
      "4": 调解分歧、邀请沉默者、推动收敛
      "5": 是小组达成一致的关键粘合剂，且被成员信任
    action_if_low: 主动做一次"合并同类项"：把前面几人的观点归纳成两三个选项再请大家表决
  - key: leadership
    label: 领导影响
    definition: 无领导情境下实际发挥的组织与影响力
    anchors:
      "1": 完全跟随，无组织行为
      "2": 有表现欲但无人跟随
      "3": 提出过流程建议，影响有限
      "4": 主动立框架/分任务/控节奏，且被采纳
      "5": 实际主导讨论走向，组织行为全程被小组接纳
    action_if_low: 讨论开局 2 分钟内主动提出流程建议："我们先花 5 分钟定标准，再过选项"
  - key: composure
    label: 情绪抗压
    definition: 面对打断、反对与压力的稳定性
    anchors:
      "1": 被反驳后情绪化攻击他人或彻底退出
      "2": 被反驳后明显慌乱、退缩或语无伦次
      "3": 基本平稳，偶有急躁但未失控
      "4": 面对反对能平稳回应、据理力争
      "5": 高压下冷静拆解对方观点，化压力为说服力
    action_if_low: 被反驳时先复述对方观点再回应（"你担心的是X，我的考虑是Y"），不抢话不辩解
  - key: role_time
    label: 角色与时间管理
    definition: 隐性角色承担与时间意识
    anchors:
      "1": 无角色意识，发言挤占他人时间
      "2": 偶有时间提醒，无角色行为
      "3": 履行了简单角色（记录/计时）之一
      "4": 主动计时提醒、阶段总结，关键时刻站出来
      "5": 全程掌控节奏：时间提醒、进度收敛、总结陈词一气呵成
    action_if_low: 主动认领计时角色：在时间过半和剩 5 分钟时各做一次明确提醒
