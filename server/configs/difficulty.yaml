# 难度档位（docs/04§7）：scale 为对人格卡基础参数的乘数，M1 实测中微调
presets:
  - key: newbie
    label: 新手陪跑
    description: AI 温和不抢话，适合熟悉流程
    aggressiveness_scale: 0.25
    content_quality_scale: 0.40
    diversity: 0.3
    pressure_events: 0.0
    pace: 12
    user_interruptible: false
    interviewer_style: "off"

  - key: standard
    label: 标准校招
    description: 贴近一般校招群面强度
    aggressiveness_scale: 0.50
    content_quality_scale: 0.60
    diversity: 0.6
    pressure_events: 0.3
    pace: 10
    user_interruptible: false
    interviewer_style: normal

  - key: realistic
    label: 拟真大厂
    description: 强度接近头部大厂群面，有抢话与冲突
    aggressiveness_scale: 0.70
    content_quality_scale: 0.75
    diversity: 0.8
    pressure_events: 0.6
    pace: 8
    user_interruptible: true
    interviewer_style: normal

  - key: hell
    label: 地狱压力
    description: 全强势对手+集火+压力面，抗压专项训练
    aggressiveness_scale: 0.90
    content_quality_scale: 0.90
    diversity: 0.9
    pressure_events: 1.0
    pace: 6
    user_interruptible: true
    interviewer_style: stress
