id: q_2026_008
type: case_analysis
industry: 快消
difficulty: 3
title: 功能饮料销量下滑诊断
material: |
  某功能饮料品牌今年二季度销量同比下降 18%。已知信息：
  渠道铺货率与去年持平；主要竞品上月新推电解质水并冠头电竞联赛，声量大涨；
  品牌自播间粉丝数增长 50% 但转化率下降 40%；经销商回款周期从 45 天升至 70 天；
  产品价格与配方未变。
requirement: |
  25 分钟内输出：销量下滑的三个主因假设、每个假设的验证方法、以及短期（一个月内）止血动作。
key_points:
  - 用"渠道 / 产品 / 营销 / 价格"框架拆解，避免被单点信息带偏
  - 回款周期变长常指向渠道库存积压，是隐蔽但关键的一条线索
  - 区分相关与因果：竞品声量涨不必然等于本品流失，需分渠道/区域数据验证
assessment_focus: [内容贡献, 逻辑结构, 沟通表达]
time_limit: { reading: 300, opening: 90, discussion: 1500, summary: 180 }
tags: [案例诊断, 快消]
