id: q_2026_003
type: ranking
industry: 通用
difficulty: 1
title: 荒岛求生物品重要性排序
material: |
  你们乘小型飞机迫降在无人荒岛，救援预计 72 小时后到达。
  可携带的物品各一份：打火机、瑞士军刀、便携净水器、帐篷、渔网、信号镜、
  急救包、指南针、防水布、压缩粮食。
requirement: |
  20 分钟内就十件物品的重要性排序达成一致，并明确说明排序所依据的标准。
key_points:
  - 先立标准（生存优先级：饮水 > 取火 > 庇护 > 求救信号 > 食物）再排序，是本题的高分路径
  - 标准之争比列表本身更考察人；72 小时设定意味着求救与保温权重上升
  - 无标准答案，结论与标准自洽即可
assessment_focus: [逻辑结构, 团队协作, 沟通表达]
time_limit: { reading: 180, opening: 60, discussion: 1200, summary: 180 }
tags: [经典, 求生]
