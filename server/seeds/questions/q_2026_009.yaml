id: q_2026_009
type: case_analysis
industry: 消费
difficulty: 3
title: 新式茶饮品牌是否进入下沉市场
material: |
  某新式茶饮品牌客单价 28 元，一线城市门店 600 家、接近饱和；
  头部竞品在三线及以下城市客单价 15 元，门店数增速 40%；
  本品牌冷链原料成本在低线城市比一线高出 18%；近期加盟商咨询量明显上升；
  董事会要求管理层一个月内给出下沉决策建议。
requirement: |
  25 分钟内讨论并输出：是否进入下沉市场的结论、进入需满足的三个前提条件、
  两个最大风险及对应对冲措施。
key_points:
  - 有条件进入或试点进入通常优于非黑即白，前提条件要可验证（如单店模型测算）
  - 成本结构（冷链、加盟管理能力）是硬约束，不解决则规模越大亏损越快
  - 结论需回应董事会的时间约束：一个月内能拿到什么数据支撑决策
assessment_focus: [逻辑结构, 内容贡献, 领导影响]
time_limit: { reading: 300, opening: 90, discussion: 1500, summary: 180 }
tags: [市场进入, 战略]
