id: q_2026_005
type: ranking
industry: 人力资源
difficulty: 2
title: 管培生选才标准排序
material: |
  某高速扩张的消费公司校招管培生，初筛通过后的评价维度有八项：
  学历背景、实习经历、专业匹配、沟通表达、学习能力、文化契合、抗压性、领导潜质。
  业务方抱怨"招进来的管培生两年流失率 40%"。
requirement: |
  25 分钟内为管培生项目排出最重要的六项标准（顺序敏感）并说明取舍理由，
  需回应"流失率高"这一背景信息。
key_points:
  - 先明确管培生画像：轮岗培养 + 未来管理者，可塑性的权重高于即战力
  - 流失率高通常指向文化契合与预期管理，而非能力项
  - 标准之间要可操作区分，避免两项标准实质重复
assessment_focus: [内容贡献, 逻辑结构, 团队协作]
time_limit: { reading: 240, opening: 60, discussion: 1500, summary: 180 }
tags: [排序, 选才]
