id: q_2026_007
type: resource_allocation
industry: 公共管理
difficulty: 2
title: 老旧小区 80 万改造资金分配
material: |
  某建于上世纪 90 年代的小区获得 80 万改造资金，居民约 1200 户、60 岁以上占比 35%。
  候选项目：加装电梯（60 万，惠及高层高龄住户）、雨污分流（35 万，解决长期返水）、
  适老化改造（20 万，惠及老人）、口袋公园（15 万，全龄受益）、智慧门禁（12 万，安全提升）。
requirement: |
  25 分钟内达成一致的分配方案，必须正面回应"受益人群覆盖面 vs 需求急迫性"的冲突。
key_points:
  - 材料未给楼栋结构、返水户数等信息，主动列出"还缺什么信息、向谁要"是高分点
  - 覆盖面（门禁、公园）与急迫性（电梯、雨污）的公平权衡是核心矛盾
  - 可分期实施、申请追加资金等组合解优于单选
assessment_focus: [内容贡献, 团队协作, 逻辑结构]
time_limit: { reading: 240, opening: 60, discussion: 1500, summary: 180 }
tags: [预算, 公平]
