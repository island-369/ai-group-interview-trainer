id: q_2026_004
type: ranking
industry: 通用
difficulty: 2
title: 职业成功要素优先级排序
material: |
  十项要素：机遇、智商、情商、执行力、学习能力、人脉资源、抗压能力、
  目标感、导师提携、家庭支持。
requirement: |
  25 分钟内就"对职业前十年发展影响最大的要素"排出优先级并达成一致，
  需先给出排序标准，最后用一句话向面试官陈述结论。
key_points:
  - 第一步是定义"成功"（职位晋升 / 财富 / 能力成长），定义不同结论完全不同
  - 高分解法常用"可控性 × 影响面"建二维标准，把不可控项（机遇、家庭）单列讨论
  - 把不可控项排最前会导致讨论空转，考察团队的收敛意识
assessment_focus: [逻辑结构, 领导影响, 倾听回应]
time_limit: { reading: 240, opening: 60, discussion: 1500, summary: 180 }
tags: [排序, 职业发展]
