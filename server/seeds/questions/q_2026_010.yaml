id: q_2026_010
type: case_analysis
industry: 在线教育
difficulty: 3
title: 职业教育 App 增长停滞诊断
material: |
  某职业教育 App 月活半年持平于 120 万：
  广告投放 ROI 从 1.8 降至 0.9；课程完课率 22%（行业均值 35%）；
  老学员续费率 41%；用户 NPS 为 31（行业优秀水平）；
  竞品上月上线"AI 刷题"功能并快速起量。
requirement: |
  25 分钟内输出：增长停滞的主因诊断、一个建议调整的北极星指标、
  以及三个可归因验证的增长实验。
key_points:
  - 两条线索要分开归因：拉新乏力（ROI 下降）与留存不足（完课率低）相互叠加
  - NPS 高但完课率低说明产品口碑与学习效果脱节，续费与转介绍的基础并不牢
  - 北极星指标候选：完课学员数 / 每周有效学习时长，优于注册数；实验需可 A/B 归因
assessment_focus: [内容贡献, 逻辑结构, 团队协作]
time_limit: { reading: 300, opening: 90, discussion: 1500, summary: 180 }
tags: [案例诊断, 增长]
