id: q_2026_006
type: resource_allocation
industry: 互联网
difficulty: 2
title: 100 万内部创新预算的分配
material: |
  你们是某互联网公司战略委员会，公司拿出 100 万支持内部创新，六个候选项目：
  AI 客服降本（申请 30 万，ROI 高）、员工健康平台（25 万，ROI 中）、
  海外市场调研（20 万，战略价值高）、自动化测试工具（15 万，ROI 高）、
  内部知识库（10 万，ROI 低）、创新孵化基金（40 万，高风险高回报）。
  各项目申请总额 140 万，超出预算。
requirement: |
  25 分钟内达成一致的分配方案（允许部分资助与阶段拨款），
  并明确说明所用的分配标准与取舍逻辑。
key_points:
  - 申请总额超预算是刻意设计，逼出真实的取舍与组合思维
  - 高分路径：先定标准（ROI / 战略价值 / 风险）再分配，用部分资助+里程碑拨付化解冲突
  - 警惕平均主义与"都给一点"的和稀泥方案
assessment_focus: [内容贡献, 逻辑结构, 领导影响]
time_limit: { reading: 240, opening: 60, discussion: 1500, summary: 180 }
tags: [预算, 决策, 经典]
