id: q_2026_002
type: open_debate
industry: 人力资源
difficulty: 2
title: AI 面试官该不该用于校招初筛
material: |
  某大厂用 AI 视频面试完成 10 万名候选人的校招初筛，筛选成本下降 70%，出结果从两周缩短到一天；
  但候选人社区抱怨"对着机器说话发挥失常"，且有研究提示算法可能在院校、性别维度存在隐性偏差。
requirement: |
  25 分钟内给出团队结论（应该 / 不应该 / 有条件应该）与三条理由，
  并替使用 AI 面试的企业提出一条不可逾越的红线建议。
key_points:
  - 核心权衡是效率与公平；"有条件应该 + 人工复核抽样 + 算法定期审计"是高分解法
  - 区分场景：初筛（可自动化）与终面（人际判断）不应混为一谈
  - 注意候选人体验与雇主品牌的外部性
assessment_focus: [逻辑结构, 团队协作, 内容贡献]
time_limit: { reading: 240, opening: 60, discussion: 1500, summary: 180 }
tags: [辩题, 科技伦理]
